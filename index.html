<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RAIDEN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// === CONSTANTS & CONFIG ===
const W = 480, H = 640;
const FPS = 60;
const STEP = 1 / FPS;
const CHARGE_DURATION = 1.0;
const STAGE_COUNT = 8;
const STAGE_DIFF  = [1.0, 1.15, 1.30, 1.45, 1.60, 1.80, 2.00, 2.25];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// === STATE MACHINE ===
const STATE = { TITLE: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, STAGECLEAR: 4, VICTORY: 5 };
let state = STATE.TITLE;
let settingsOpen = false;

// Settings
let soundOn = true;
let gameSpeed = 1.0;
const SPEED_STEPS = [0.75, 1.0, 1.25];

// Score / persistence
let score = 0;
let highScore = parseInt(localStorage.getItem('raidenHS') || '0');
function saveHS() {
  if (score > highScore) { highScore = score; localStorage.setItem('raidenHS', highScore); }
}

// === INPUT ===
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    handleKeyPress(e.code);
  }
  e.preventDefault();
}, { passive: false });
document.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); }, { passive: false });

function handleKeyPress(code) {
  if (settingsOpen) {
    if (code === 'KeyM')        soundOn = !soundOn;
    if (code === 'BracketLeft') cycleSpeed(-1);
    if (code === 'BracketRight')cycleSpeed(1);
    if (code === 'KeyS')        settingsOpen = false;
    return;
  }
  if (code === 'KeyP') {
    if (state === STATE.PLAYING) state = STATE.PAUSED;
    else if (state === STATE.PAUSED) state = STATE.PLAYING;
  }
  if (code === 'KeyS') {
    if (settingsOpen) {
      settingsOpen = false;
    } else if (state === STATE.TITLE || state === STATE.PAUSED) {
      settingsOpen = true;
    } else if (state === STATE.PLAYING) {
      // Auto-pause so the game doesn't run under the settings panel
      state = STATE.PAUSED;
      settingsOpen = true;
    }
  }
  if (code === 'Enter') {
    if (state === STATE.TITLE)    { loopMult = 1; startGame(); }
    if (state === STATE.GAMEOVER) state = STATE.TITLE;
    if (state === STATE.VICTORY)  { loopMult++; startGame(); }  // start loop 2+
  }
  if (code === 'KeyC' && state === STATE.GAMEOVER) {
    navigator.clipboard && navigator.clipboard.writeText(
      'RAIDEN — Score: ' + score + ' | Hi: ' + highScore);
  }
}

function cycleSpeed(dir) {
  let i = SPEED_STEPS.indexOf(gameSpeed);
  i = Math.max(0, Math.min(SPEED_STEPS.length - 1, i + dir));
  gameSpeed = SPEED_STEPS[i];
}

// === TOUCH CONTROLS (mobile) ===
// Touch is just another writer into the keys[] map + handleKeyPress(), so the
// game logic below is untouched. Controls render/handle only on touch devices.
const isTouch = ('ontouchstart' in window) ||
                (window.matchMedia && matchMedia('(pointer: coarse)').matches);

// Control geometry, in game coordinates (480x640).
const TC = {
  dpad:  { x: 84,     y: H - 96, r: 62, dead: 12 },
  fire:  { x: W - 66, y: H - 86, r: 48 },
  bomb:  { x: W - 66, y: H - 176, r: 34 },
  pause: { x: W - 26, y: 52, r: 16 },
  gear:  { x: W - 68, y: 52, r: 16 },
};
const touchPts = {};        // identifier -> {x, y} in game coords
let firePressed = false;    // glow flags for drawing
let bombPressed = false;

function toCanvas(t) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rect.left) / rect.width  * W,
    y: (t.clientY - rect.top)  / rect.height * H,
  };
}
function within(p, c) {
  const dx = p.x - c.x, dy = p.y - c.y;
  return dx * dx + dy * dy <= c.r * c.r;
}

// Discrete (one-per-press) actions for a freshly-started touch.
// Returns true if the touch was consumed (should not drive movement).
function touchDiscrete(p) {
  if (settingsOpen) {
    const bx = W/2 - 130, by = H/2 - 90, bw = 260, bh = 185;
    if (p.y > by + 55 && p.y < by + 80) { handleKeyPress('KeyM'); return true; }
    if (p.y > by + 80 && p.y < by + 105) { cycleSpeed(p.x < W/2 ? -1 : 1); return true; }
    if (p.x < bx || p.x > bx + bw || p.y < by || p.y > by + bh) settingsOpen = false;
    return true;  // swallow all taps while settings is open
  }
  if (within(p, TC.gear) &&
      (state === STATE.TITLE || state === STATE.PLAYING || state === STATE.PAUSED)) {
    handleKeyPress('KeyS');
    return true;
  }
  if (within(p, TC.pause) && (state === STATE.PLAYING || state === STATE.PAUSED)) {
    handleKeyPress('KeyP');
    return true;
  }
  if (state === STATE.TITLE || state === STATE.GAMEOVER || state === STATE.VICTORY) {
    handleKeyPress('Enter');
    return true;
  }
  return false;
}

// Rebuild the continuous (held) touch-owned keys from all active touch points.
function applyTouchMovement() {
  keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = false;
  keys['Space'] = false;
  firePressed = false;
  let bombNow = false;
  const d = TC.dpad, reach = d.r * 1.35;
  for (const id in touchPts) {
    const p = touchPts[id];
    if (within(p, TC.fire)) { keys['Space'] = true; firePressed = true; continue; }
    if (within(p, TC.bomb)) { bombNow = true; continue; }
    const dx = p.x - d.x, dy = p.y - d.y;
    if (dx * dx + dy * dy <= reach * reach) {
      if (dx < -d.dead) keys['ArrowLeft']  = true;
      if (dx >  d.dead) keys['ArrowRight'] = true;
      if (dy < -d.dead) keys['ArrowUp']    = true;
      if (dy >  d.dead) keys['ArrowDown']  = true;
    }
  }
  keys['KeyB'] = bombNow;   // _bombUsed latch in updatePlayer makes this one-shot
  bombPressed = bombNow;
}

if (isTouch) {
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    getAudio();  // unlock WebAudio on first user gesture
    for (const t of e.changedTouches) {
      const p = toCanvas(t);
      if (touchDiscrete(p)) continue;   // consumed by a menu/button
      touchPts[t.identifier] = p;
    }
    applyTouchMovement();
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (touchPts[t.identifier]) touchPts[t.identifier] = toCanvas(t);
    }
    applyTouchMovement();
  }, { passive: false });

  const endTouch = e => {
    e.preventDefault();
    for (const t of e.changedTouches) delete touchPts[t.identifier];
    applyTouchMovement();
  };
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });
}

function drawTcBtn(c, stroke, label, fontPx) {
  ctx.strokeStyle = stroke;
  ctx.fillStyle = 'rgba(20,30,50,0.38)';
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#dde';
  ctx.font = (fontPx || 15) + 'px monospace';
  ctx.fillText(label, c.x, c.y);
}

function drawTouchControls() {
  if (!isTouch) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 2;

  const playing = (state === STATE.PLAYING || state === STATE.PAUSED);

  if (playing) {
    // D-pad
    const d = TC.dpad;
    ctx.strokeStyle = 'rgba(120,180,255,0.5)';
    ctx.fillStyle   = 'rgba(30,50,90,0.28)';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = '18px monospace';
    const dirs = [
      ['ArrowUp',    0,       -d.r*0.6, '▲'],
      ['ArrowDown',  0,        d.r*0.6, '▼'],
      ['ArrowLeft', -d.r*0.6,  0,       '◀'],
      ['ArrowRight', d.r*0.6,  0,       '▶'],
    ];
    for (const [k, ox, oy, ch] of dirs) {
      ctx.fillStyle = keys[k] ? '#ffff66' : 'rgba(160,200,255,0.8)';
      ctx.fillText(ch, d.x + ox, d.y + oy);
    }

    // Fire
    const f = TC.fire;
    ctx.strokeStyle = 'rgba(255,120,120,0.55)';
    ctx.fillStyle = firePressed ? 'rgba(255,80,80,0.42)' : 'rgba(90,30,30,0.28)';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffcccc'; ctx.font = 'bold 15px monospace';
    ctx.fillText('FIRE', f.x, f.y);

    // Bomb
    const b = TC.bomb;
    ctx.strokeStyle = 'rgba(255,150,255,0.55)';
    ctx.fillStyle = bombPressed ? 'rgba(255,100,255,0.42)' : 'rgba(70,30,70,0.28)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffccff'; ctx.font = 'bold 18px monospace';
    ctx.fillText('★', b.x, b.y);

    // Pause
    drawTcBtn(TC.pause, 'rgba(200,200,200,0.5)',
              state === STATE.PAUSED ? '▶' : '‖');
  }

  if (state === STATE.TITLE || playing) {
    drawTcBtn(TC.gear, 'rgba(120,180,255,0.5)', '⚙');
  }

  if (state === STATE.TITLE || state === STATE.GAMEOVER || state === STATE.VICTORY) {
    ctx.fillStyle = 'rgba(255,255,120,0.85)';
    ctx.font = '13px monospace';
    ctx.fillText('( TAP SCREEN )', W/2, H - 40);
  }

  ctx.restore();
}


// === AUDIO ===
let audioCtx = null;

function getAudio() {
  if (!audioCtx)
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// weapon: 0=vulcan, 1=spread, 2=missile
function sfxShoot(weapon) {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const osc  = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    if (weapon === 1) {
      // Spread: medium-pitch square wave burst
      osc.type = 'square';
      osc.frequency.setValueAtTime(520 + Math.random() * 60, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, ac.currentTime + 0.14);
      gain.gain.setValueAtTime(0.10, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
      osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.15);
    } else {
      osc.type = weapon === 2 ? 'square' : 'square';
      const base = [880, 440, 660][weapon];
      osc.frequency.setValueAtTime(base + Math.random() * 40, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(base * 0.5, ac.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
      osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.1);
    }
  } catch(e) {}
}

// size: 1 (fighter) – 4 (boss chunk)
function sfxExplosion(size) {
  if (!soundOn) return;
  try {
    const ac  = getAudio();
    const len = ac.sampleRate * 0.4;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src    = ac.createBufferSource();
    const filter = ac.createBiquadFilter();
    const gain   = ac.createGain();
    src.buffer = buf;
    filter.type = 'lowpass';
    filter.frequency.value = 300 + size * 200;
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    gain.gain.setValueAtTime(Math.min(1, 0.15 + size * 0.1), ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
    src.start(ac.currentTime);
  } catch(e) {}
}

function sfxPowerup() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    [523, 659, 784].forEach((freq, i) => {
      const osc  = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ac.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      osc.start(t); osc.stop(t + 0.16);
    });
  } catch(e) {}
}

function sfxBomb() {
  if (!soundOn) return;
  try {
    const ac  = getAudio();
    const len = ac.sampleRate * 1.0;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src    = ac.createBufferSource();
    const filter = ac.createBiquadFilter();
    const gain   = ac.createGain();
    src.buffer = buf;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(80, ac.currentTime);
    filter.frequency.linearRampToValueAtTime(900, ac.currentTime + 0.3);
    filter.frequency.exponentialRampToValueAtTime(50, ac.currentTime + 1.0);
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    gain.gain.setValueAtTime(0.6, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.0);
    src.start(ac.currentTime);
  } catch(e) {}
}

// === STARFIELD ===
const STAR_LAYERS = [
  { stars: [], speed: 60,  size: 1.0, color: 'rgba(255,255,255,0.4)' },
  { stars: [], speed: 120, size: 1.5, color: 'rgba(255,255,255,0.7)' },
  { stars: [], speed: 200, size: 2.0, color: 'rgba(200,220,255,1.0)' },
];
(function initStars() {
  STAR_LAYERS.forEach(layer => {
    for (let i = 0; i < 60; i++)
      layer.stars.push({ x: Math.random() * W, y: Math.random() * H });
  });
})();

function updateStars(dt) {
  STAR_LAYERS.forEach(layer => {
    layer.stars.forEach(s => {
      s.y += layer.speed * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    });
  });
}

function drawStars() {
  STAR_LAYERS.forEach(layer => {
    ctx.fillStyle = layer.color;
    layer.stars.forEach(s => ctx.fillRect(s.x, s.y, layer.size, layer.size));
  });
}

// === STAGE BACKGROUNDS ===
const STAGE_BG = [
  { baseFill: '#020208', starColor: ['rgba(255,255,255,0.4)', 'rgba(255,255,255,0.7)', 'rgba(200,220,255,1.0)'] },
  { baseFill: '#0f0c08', starColor: ['rgba(200,190,170,0.3)', 'rgba(210,200,180,0.5)', 'rgba(220,210,190,0.8)'] },
  { baseFill: '#1a0005', starColor: ['rgba(255,160,160,0.35)', 'rgba(255,120,120,0.6)', 'rgba(255,200,200,0.9)'] },
  { baseFill: '#051005', starColor: null },
  { baseFill: '#1a0800', starColor: null },
  { baseFill: '#080810', starColor: ['rgba(180,180,200,0.25)', 'rgba(190,190,210,0.45)', 'rgba(210,210,230,0.7)'] },
  { baseFill: '#000000', starColor: ['rgba(160,80,255,0.3)', 'rgba(180,100,255,0.5)', 'rgba(200,140,255,0.8)'] },
  { baseFill: '#100005', starColor: null },
];

let bgRocks     = [];
let bgClouds    = [];
let bgBubbles   = [];
let bgStreaks    = [];
let bgHulls     = [];
let bgWisps     = [];
let bgParticles = [];
let bgWalls     = [];
let bgStage     = 1;

function initBackground(stage) {
  bgStage = stage;
  bgRocks.length = 0; bgClouds.length = 0; bgBubbles.length = 0;
  bgStreaks.length = 0; bgHulls.length = 0; bgWisps.length = 0;
  bgParticles.length = 0; bgWalls.length = 0;

  if (stage === 1) return; // stars only — stage 6 has hulls too

  if (stage === 2) {
    for (let i = 0; i < 14; i++) {
      bgRocks.push({ x: Math.random()*W, y: Math.random()*H, r: 8+Math.random()*12,
        spd: 60+Math.random()*40, rot: Math.random()*Math.PI*2,
        rotSpd: (Math.random()-0.5)*0.8, layer: 0 });
    }
    for (let i = 0; i < 8; i++) {
      bgRocks.push({ x: Math.random()*W, y: Math.random()*H, r: 5+Math.random()*8,
        spd: 100+Math.random()*40, rot: Math.random()*Math.PI*2,
        rotSpd: (Math.random()-0.5)*1.2, layer: 1 });
    }
    return;
  }

  if (stage === 3) {
    for (let i = 0; i < 12; i++) {
      bgClouds.push({ x: Math.random()*W, y: Math.random()*H,
        w: 80+Math.random()*80, h: 40+Math.random()*40,
        alpha: 0.06+Math.random()*0.06, spd: 20+Math.random()*20,
        hue: Math.random()<0.5 ? '#cc2244' : '#aa1133' });
    }
    return;
  }

  if (stage === 4) {
    for (let i = 0; i < 40; i++) {
      bgBubbles.push({ x: Math.random()*W, y: Math.random()*H,
        r: 4+Math.random()*8, alpha: 0.08+Math.random()*0.12,
        spd: 18+Math.random()*22, wobbleAmp: 8+Math.random()*14,
        wobbleFreq: 0.6+Math.random()*0.8, wobbleOff: Math.random()*Math.PI*2,
        color: Math.random()<0.6 ? '#44ee44' : '#aaee00',
        t: Math.random()*100 });
    }
    return;
  }

  if (stage === 5) {
    for (let i = 0; i < 30; i++) {
      bgStreaks.push({ x: Math.random()*W, y: Math.random()*H,
        w: 40+Math.random()*80, h: 1+Math.floor(Math.random()*2),
        spd: 300+Math.random()*200, alpha: 0.18+Math.random()*0.25,
        color: Math.random()<0.7 ? '#ff8800' : '#ffcc44' });
    }
    return;
  }

  if (stage === 6) {
    for (let i = 0; i < 10; i++) {
      bgHulls.push({
        x: Math.random() * (W - 120),
        y: Math.random() * H,
        w: 60 + Math.random() * 60,
        h: 12 + Math.random() * 14,
        spd: 25 + Math.random() * 15,
        alpha: 0.18 + Math.random() * 0.12,
      });
    }
    return;
  }

  if (stage === 7) {
    for (let i = 0; i < 8; i++) {
      const x1 = Math.random()*W, y1 = Math.random()*H;
      bgWisps.push({ x1, y1,
        x2: x1+(Math.random()-0.5)*160, y2: y1+(Math.random()-0.5)*100,
        cx1: x1+(Math.random()-0.5)*80, cy1: y1+(Math.random()-0.5)*80,
        cx2: x1+(Math.random()-0.5)*80, cy2: y1+(Math.random()-0.5)*80,
        alpha: 0.04+Math.random()*0.06,
        color: Math.random()<0.5 ? '#9944ff' : '#cc88ff',
        width: 1+Math.random()*2 });
    }
    return;
  }

  if (stage === 8) {
    for (let i = 0; i < 8; i++) {
      bgWalls.push({ side:'left', y: i*(H/8), baseX: 30+Math.random()*20,
        h: H/8+4, sineAmp: 14+Math.random()*10,
        sineFreq: 0.4+Math.random()*0.4, sineOff: Math.random()*Math.PI*2, color:'#550011' });
      bgWalls.push({ side:'right', y: i*(H/8), baseX: W-30-Math.random()*20,
        h: H/8+4, sineAmp: 14+Math.random()*10,
        sineFreq: 0.4+Math.random()*0.4, sineOff: Math.random()*Math.PI*2, color:'#550011' });
    }
    for (let i = 0; i < 50; i++) {
      bgParticles.push({ x: Math.random()*W, y: Math.random()*H,
        r: 1+Math.random()*2, spd: 30+Math.random()*50,
        alpha: 0.3+Math.random()*0.4,
        color: Math.random()<0.7 ? '#ff2200' : '#ff6600' });
    }
    return;
  }
}

function updateBackground(dt) {
  const stage = bgStage;
  if (stage === 2) {
    bgRocks.forEach(r => {
      r.y += r.spd * dt; r.rot += r.rotSpd * dt;
      if (r.y > H + r.r*2) { r.y = -r.r*2; r.x = Math.random()*W; }
    });
  }
  if (stage === 3) {
    bgClouds.forEach(c => {
      c.y += c.spd * dt;
      if (c.y > H + c.h) { c.y = -c.h; c.x = Math.random()*W; }
    });
  }
  if (stage === 4) {
    bgBubbles.forEach(b => {
      b.t += dt; b.y -= b.spd * dt;
      b.x += Math.sin(b.t * b.wobbleFreq + b.wobbleOff) * b.wobbleAmp * dt;
      if (b.y < -b.r*2) { b.y = H+b.r*2; b.x = Math.random()*W; }
    });
  }
  if (stage === 5) {
    bgStreaks.forEach(s => {
      s.y += s.spd * dt;
      if (s.y > H+4) { s.y = -4; s.x = Math.random()*(W-s.w); }
    });
  }
  if (stage === 6) {
    bgHulls.forEach(h => {
      h.y += h.spd * dt;
      if (h.y > H+h.h) { h.y = -h.h; h.x = Math.random()*(W-h.w); }
    });
  }
  if (stage === 8) {
    bgParticles.forEach(p => {
      p.y -= p.spd * dt;
      if (p.y < -p.r*2) { p.y = H+p.r*2; p.x = Math.random()*W; }
    });
  }
}

function drawBackground(stage) {
  const cfg = STAGE_BG[Math.max(0, Math.min(7, stage-1))];
  ctx.fillStyle = cfg.baseFill;
  ctx.fillRect(0, 0, W, H);

  if (cfg.starColor) {
    // Save current colors so the title screen's classic starfield isn't left tinted
    const savedColors = STAR_LAYERS.map(l => l.color);
    STAR_LAYERS[0].color = cfg.starColor[0];
    STAR_LAYERS[1].color = cfg.starColor[1];
    STAR_LAYERS[2].color = cfg.starColor[2];
    STAR_LAYERS.forEach(layer => {
      ctx.fillStyle = layer.color;
      layer.stars.forEach(s => ctx.fillRect(s.x, s.y, layer.size, layer.size));
    });
    STAR_LAYERS.forEach((l, i) => { l.color = savedColors[i]; });
  }

  if (stage === 2) {
    bgRocks.forEach(r => {
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
      ctx.fillStyle = r.layer===0 ? 'rgba(130,120,110,0.5)' : 'rgba(100,95,85,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 0, r.r*1.4, r.r, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(180,170,155,0.2)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    });
  }

  if (stage === 3) {
    bgClouds.forEach(c => {
      ctx.save(); ctx.globalAlpha = c.alpha; ctx.fillStyle = c.hue;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w/2, c.h/2, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  if (stage === 4) {
    bgBubbles.forEach(b => {
      ctx.save(); ctx.globalAlpha = b.alpha; ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = b.alpha * 0.5; ctx.fillStyle = '#ccffcc';
      ctx.beginPath(); ctx.arc(b.x-b.r*0.3, b.y-b.r*0.3, b.r*0.4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  if (stage === 5) {
    bgStreaks.forEach(s => {
      ctx.save(); ctx.globalAlpha = s.alpha; ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, s.w, s.h);
      const grad = ctx.createLinearGradient(s.x, s.y, s.x+s.w*0.3, s.y);
      grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, s.color);
      ctx.fillStyle = grad; ctx.fillRect(s.x, s.y, s.w*0.3, s.h);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  if (stage === 6) {
    bgHulls.forEach(h => {
      ctx.save(); ctx.globalAlpha = h.alpha;
      ctx.fillStyle = '#1a1a28'; ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = 'rgba(100,100,140,0.6)';
      const rivets = Math.floor(h.w/14);
      for (let i = 0; i < rivets; i++) {
        ctx.beginPath(); ctx.arc(h.x+8+i*14, h.y+h.h/2, 1.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(80,80,120,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(h.x, h.y+3); ctx.lineTo(h.x+h.w, h.y+3); ctx.stroke();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  if (stage === 7) {
    bgWisps.forEach(w => {
      ctx.save(); ctx.globalAlpha = w.alpha; ctx.strokeStyle = w.color; ctx.lineWidth = w.width;
      ctx.beginPath(); ctx.moveTo(w.x1, w.y1);
      ctx.bezierCurveTo(w.cx1, w.cy1, w.cx2, w.cy2, w.x2, w.y2);
      ctx.stroke(); ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  if (stage === 8) {
    const t = stageTimer;
    bgWalls.forEach(w => {
      const xOff = Math.sin(t * w.sineFreq + w.sineOff) * w.sineAmp;
      const drawX = w.side === 'left' ? w.baseX + xOff : w.baseX - xOff;
      ctx.save(); ctx.fillStyle = w.color;
      if (w.side === 'left') {
        ctx.fillRect(0, w.y, drawX, w.h);
      } else {
        ctx.fillRect(drawX, w.y, W - drawX, w.h);
      }
      ctx.strokeStyle = '#aa0022'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(drawX, w.y); ctx.lineTo(drawX, w.y + w.h); ctx.stroke();
      ctx.restore();
    });
    bgParticles.forEach(p => {
      ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }
}

// === PARTICLES ===
let particles = [];

// size: 1=small fighter, 2=gunship, 3=bomber, 4=boss chunk, 6=boss death
function spawnExplosion(x, y, size, color) {
  const count = 6 + size * 4;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd   = 40 + Math.random() * 80 * size;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1.0,
      decay: 0.7 + Math.random() * 0.8,
      r: 2 + Math.random() * size * 3,
      color: color || '#ff8800',
      bomb: false,
    });
  }
  sfxExplosion(size);
}

// Full-screen flash for bomb
function spawnBombFlash() {
  particles.push({ bomb: true, life: 1.0, decay: 2.5,
    x:0, y:0, vx:0, vy:0, r:0, color:'', });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= p.decay * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (!p.bomb) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy *= 0.94;
    }
  }
}

function drawParticles() {
  particles.forEach(p => {
    if (p.bomb) {
      ctx.fillStyle = 'rgba(255,255,200,' + (p.life * 0.75) + ')';
      ctx.fillRect(0, 0, W, H);
      return;
    }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, p.r * p.life), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// === PLAYER ===
let player = null;

function createPlayer() {
  return {
    x: W / 2, y: H - 100,
    r: 14,            // collision radius
    speed: 280,       // px/s — tuned to arcade feel
    lives: 3,
    bombs: 3,
    invTimer: 0,      // seconds of invincibility remaining
    weapons: [{ type: 0, lv: 1 }],  // FIFO queue, max 2. Each: {type:0-2, lv:1-5}
    shootTimer: 0,
    dead: false,
    respawnTimer: 0,
    gameOverTimer: undefined,
    chargeTime:  0,
    charging:    false,
    chargeFired: false,
  };
}

function drawPlayer(p) {
  if (p.dead) return;
  // Flicker during invincibility: hide on odd 10ths of a second
  if (p.invTimer > 0 && Math.floor(p.invTimer * 10) % 2 === 0) return;

  ctx.save();
  ctx.translate(p.x, p.y);

  // Engine glow
  const glow = ctx.createRadialGradient(0, 10, 0, 0, 10, 18);
  glow.addColorStop(0, 'rgba(0,180,255,0.85)');
  glow.addColorStop(1, 'rgba(0,80,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 10, 18, 0, Math.PI * 2); ctx.fill();

  // Left wing
  ctx.fillStyle = '#4488cc';
  ctx.beginPath();
  ctx.moveTo(-22, 10); ctx.lineTo(-8, -2); ctx.lineTo(-6, 14); ctx.closePath();
  ctx.fill();
  // Right wing
  ctx.beginPath();
  ctx.moveTo(22, 10); ctx.lineTo(8, -2); ctx.lineTo(6, 14); ctx.closePath();
  ctx.fill();

  // Fuselage
  ctx.fillStyle = '#88bbee';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(12, 10); ctx.lineTo(8, 18);
  ctx.lineTo(-8, 18); ctx.lineTo(-12, 10);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#ccffff';
  ctx.beginPath();
  ctx.ellipse(0, -8, 5, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wing accent lines
  ctx.strokeStyle = '#aaddff';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-20, 8); ctx.lineTo(-8, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, 8);  ctx.lineTo(8, 0);  ctx.stroke();

  ctx.restore();

  // Charge ring indicator — only at lv5 while charging
  if (p.weapons[0].lv === 5 && p.charging && p.chargeTime > 0) {
    const frac  = Math.min(1, p.chargeTime / CHARGE_DURATION);
    const ringR = 28 + frac * 8;
    const startAngle = -Math.PI / 2;
    const endAngle   = startAngle + frac * Math.PI * 2;
    ctx.save();
    ctx.translate(p.x, p.y);
    const primaryColor = WEAPON_COLORS[p.weapons[0].type];
    ctx.shadowColor = primaryColor;
    ctx.shadowBlur  = 12 + frac * 16;
    ctx.strokeStyle = primaryColor;
    ctx.lineWidth   = 3;
    ctx.globalAlpha = 0.55 + frac * 0.45;
    ctx.beginPath();
    ctx.arc(0, 0, ringR, startAngle, endAngle);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 1.2;
    ctx.globalAlpha = 0.7 * frac;
    ctx.beginPath();
    ctx.arc(0, 0, ringR - 3, startAngle, endAngle);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha  = 1;
    ctx.shadowBlur   = 0;
    ctx.shadowColor  = 'transparent';
  }
}

function updatePlayer(dt) {
  const p = player;
  if (p.dead) {
    if (p.gameOverTimer !== undefined) {
      p.gameOverTimer -= dt;
      if (p.gameOverTimer <= 0) state = STATE.GAMEOVER;
    } else {
      p.respawnTimer -= dt;
      if (p.respawnTimer <= 0) respawnPlayer();
    }
    return;
  }
  if (p.invTimer > 0) p.invTimer -= dt;

  const spd = p.speed * dt;
  if (keys['ArrowLeft'])  p.x -= spd;
  if (keys['ArrowRight']) p.x += spd;
  if (keys['ArrowUp'])    p.y -= spd;
  if (keys['ArrowDown'])  p.y += spd;
  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y));
  // [ARCADE] Fire rate controlled by weapon stat, not OS key-repeat (keydown/keyup map)
  laserActive = false;
  p.shootTimer -= dt;

  if (p.weapons[0].lv === 5) {
    // Hold-to-charge, release-to-fire super-shot (lv5 only)
    if (keys['Space']) {
      p.charging = true;
      p.chargeTime = Math.min(CHARGE_DURATION, p.chargeTime + dt); // cap at full
    } else if (p.charging) {
      // Space released after charging
      if (p.chargeTime >= CHARGE_DURATION) {
        fireSuper(p);            // full charge → super-shot
        p.shootTimer = 0.3;      // brief cooldown after super
      } else if (p.shootTimer <= 0) {
        p.shootTimer = getFireRate(p.weapons[0].type, p.weapons[0].lv);
        firePlayer(p);           // partial charge → single normal volley
      }
      // Reset charge state
      p.chargeTime  = 0;
      p.charging    = false;
    }
    p.chargeFired = false;
  } else {
    p.chargeTime  = 0;
    p.charging    = false;
    p.chargeFired = false;
    if (keys['Space'] && p.shootTimer <= 0) {
      p.shootTimer = getFireRate(p.weapons[0].type, p.weapons[0].lv);
      firePlayer(p);
    }
  }

  // Bomb — one activation per press (not hold)
  if (keys['KeyB'] && !keys['_bombUsed']) {
    keys['_bombUsed'] = true;
    if (p.bombs > 0) {
      p.bombs--;
      spawnBombFlash();
      sfxBomb();
      // [ARCADE] Bomb clears all enemy bullets on screen
      enemyBullets.length = 0;
      // Damage enemies and boss (will reference enemies/boss defined in later tasks)
      if (typeof enemies !== 'undefined') enemies.forEach(e => { e.hp -= 60; });
      if (typeof boss !== 'undefined' && boss) boss.hp -= 250;
    }
  }
  if (!keys['KeyB']) keys['_bombUsed'] = false;
}

function killPlayer() {
  const p = player;
  if (p.invTimer > 0 || p.dead) return;
  p.lives--;
  spawnExplosion(p.x, p.y, 3, '#88ccff');
  // [ARCADE] Player bullets cleared on death
  playerBullets.length = 0;
  laserActive = false;
  // [ARCADE] Weapon resets to Vulcan Lv1 on any death
  p.weapons = [{ type: 0, lv: 1 }];
  p.chargeTime  = 0;
  p.charging    = false;
  p.chargeFired = false;
  if (p.lives <= 0) {
    p.dead = true;
    saveHS();
    p.gameOverTimer = 1.8;  // counted down in updatePlayer, not a setTimeout
  } else {
    p.dead = true;
    p.respawnTimer = 2.0;
  }
}

function respawnPlayer() {
  const p = player;
  p.dead = false;
  p.x = W / 2; p.y = H - 100;
  p.invTimer = 3.0;
}

// === PLAYER BULLETS ===
let playerBullets = [];

// Returns seconds between shots for weapon/level combo
function getFireRate(weapon, lv) {
  if (weapon === 1) return Math.max(0.18, 0.30 - lv * 0.025); // spread: medium fire rate
  return Math.max(0.05, 0.13 - lv * 0.015);   // vulcan/missile
}

// Elongated capsule pellet (vulcan) — looks like real arcade vulcan rounds
function mkVulcanBullet(x, y, angle) {
  const spd = 680;
  return {
    type: 'bullet',
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    // store angle for drawing the elongated capsule shape
    angle,
    r: 4, dmg: 5, life: 2.0,
    lv: 1,   // overwritten by caller for correct trail/spark behavior
    pierce: false,
    trail: [],
  };
}

// Returns angle offset (radians) for a weapon slot in a combo
function comboOffset(slotIndex, totalSlots) {
  if (totalSlots === 1) return 0;
  return slotIndex === 0 ? -0.26 : 0.26;
}

function mkSpreadBullet(x, y, angle, lv) {
  const spd = 380;
  return {
    type: 'spread',
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    angle,
    r: 5 + lv,
    dmg: 10 + lv * 3,
    life: 2.0,
    lv,
    pierce: false,
  };
}

// Persistent laser state — beam is drawn directly each frame when firing, not stored in playerBullets
let laserActive  = false;   // unused now, kept to avoid reference errors in collision code
let laserPulse   = 0;       // unused now

// Called once per fire-rate tick when SPACE held
function firePlayer(p) {
  const total = p.weapons.length;
  p.weapons.forEach((slot, idx) => {
    const lv  = slot.lv;
    const off = comboOffset(idx, total);
    const UP  = -Math.PI / 2;

    if (slot.type === 0) {
      const spread = lv >= 3 ? 0.18 : 0;
      const pushV = (x, y, a) => {
        const b = mkVulcanBullet(x, y, a);
        b.lv = lv;
        playerBullets.push(b);
      };
      pushV(p.x - 8, p.y - 20, UP + off - spread);
      pushV(p.x + 8, p.y - 20, UP + off + spread);
      if (lv >= 4) {
        pushV(p.x - 18, p.y - 8, UP + off - 0.38);
        pushV(p.x + 18, p.y - 8, UP + off + 0.38);
      }
      if (lv >= 5) pushV(p.x, p.y - 22, UP + off);
      sfxShoot(0);

    } else if (slot.type === 1) {
      if (lv === 1) {
        [UP+off-0.30, UP+off, UP+off+0.30].forEach(a =>
          playerBullets.push(mkSpreadBullet(p.x, p.y-20, a, lv)));
      } else if (lv === 2) {
        const half = 0.35;
        for (let i = 0; i < 4; i++) {
          playerBullets.push(mkSpreadBullet(p.x, p.y-20, UP+off-half+(i/3)*(half*2), lv));
        }
      } else if (lv === 3) {
        const half = 0.40;
        for (let i = 0; i < 5; i++) {
          playerBullets.push(mkSpreadBullet(p.x, p.y-20, UP+off-half+(i/4)*(half*2), lv));
        }
      } else if (lv === 4) {
        const half = 0.40;
        for (let i = 0; i < 5; i++) {
          playerBullets.push(mkSpreadBullet(p.x, p.y-20, UP+off-half+(i/4)*(half*2), lv));
        }
        playerBullets.push(mkSpreadBullet(p.x-12, p.y-14, UP+off-0.70, lv));
        playerBullets.push(mkSpreadBullet(p.x+12, p.y-14, UP+off+0.70, lv));
      } else {
        const half = 0.50;
        for (let i = 0; i < 7; i++) {
          playerBullets.push(mkSpreadBullet(p.x, p.y-20, UP+off-half+(i/6)*(half*2), lv));
        }
      }
      sfxShoot(1);

    } else if (slot.type === 2) {
      const missileSpread = total > 1 ? 1.6 : 1.0;
      const counts = [2, 2, 3, 4, 5];
      const count  = counts[lv - 1];
      for (let i = 0; i < count; i++) {
        const offset = (i - (count-1)/2) * 16 * missileSpread;
        playerBullets.push({
          type: 'missile', x: p.x+offset, y: p.y-20,
          vx: offset*0.6 + Math.sin(off)*80, vy: -320,
          r: 5, dmg: 8, life: 2.2, homingDelay: 0.15+i*0.04, pierce: false,
        });
      }
      sfxShoot(2);
    }
  });
}

function fireSuper(p) {
  const total = p.weapons.length;
  p.weapons.forEach((slot, idx) => {
    const off = comboOffset(idx, total);
    const UP  = -Math.PI / 2;

    if (slot.type === 0) {
      const halfArc = Math.PI * 2 / 3;
      const count = 12;
      for (let i = 0; i < count; i++) {
        const a = UP + off - halfArc + (i/(count-1))*(halfArc*2);
        const b = mkVulcanBullet(p.x, p.y-22, a);
        b.r = 6; b.dmg = 15; b.lv = slot.lv;
        playerBullets.push(b);
      }
      sfxShoot(0);
    } else if (slot.type === 1) {
      const count = 16;
      for (let i = 0; i < count; i++) {
        const a = off + (i/count)*Math.PI*2;
        const b = mkSpreadBullet(p.x, p.y, a, 5);
        b.r = 7; b.dmg = 18;
        playerBullets.push(b);
      }
      sfxShoot(1);
    } else if (slot.type === 2) {
      const count = 8;
      const spreadMul = total > 1 ? 1.8 : 1.0;
      for (let i = 0; i < count; i++) {
        const offset = (i-(count-1)/2)*20*spreadMul;
        playerBullets.push({
          type: 'missile', x: p.x+offset, y: p.y-20,
          vx: offset*0.5 + Math.sin(off)*80, vy: -320,
          r: 6, dmg: 20, life: 2.5, homingDelay: 0, pierce: false,
        });
      }
      sfxShoot(2);
    }
  });
}

function updatePlayerBullets(dt) {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.life -= dt;
    if (b.life <= 0 || b.y < -80 || b.x < -40 || b.x > W + 40) {
      playerBullets.splice(i, 1); continue;
    }
    if (b.type === 'missile') {
      // Homing: after delay, steer toward nearest enemy/boss
      b.homingDelay -= dt;
      if (b.homingDelay <= 0) {
        let nearX = null, nearY = null, nearD = Infinity;
        if (typeof enemies !== 'undefined') enemies.forEach(e => {
          const d2 = (e.x - b.x) ** 2 + (e.y - b.y) ** 2;
          if (d2 < nearD) { nearD = d2; nearX = e.x; nearY = e.y; }
        });
        if (typeof boss !== 'undefined' && boss) {
          const d2 = (boss.x - b.x) ** 2 + (boss.y - b.y) ** 2;
          if (d2 < nearD) { nearX = boss.x; nearY = boss.y; }
        }
        if (nearX !== null) {
          const dx = nearX - b.x, dy = nearY - b.y;
          const d  = Math.sqrt(dx*dx + dy*dy) || 1;
          b.vx += (dx/d * 340 - b.vx) * dt * 5;
          b.vy += (dy/d * 340 - b.vy) * dt * 5;
        }
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
    } else {
      // Record trail before moving
      if (b.trail) {
        b.trail.unshift({ x: b.x, y: b.y });
        if (b.trail.length > 5) b.trail.length = 5;
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
  }
}

function drawLaserBeam(p) { /* replaced by plasma — kept as no-op so call site compiles */ }

function drawPlayerBullets() {
  playerBullets.forEach(b => {
    if (b.type === 'spread') {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle + Math.PI / 2);
      const lv = b.lv;
      if (lv <= 2) {
        const w = 4 + lv * 1, h = 8 + lv * 2;
        ctx.fillStyle = '#ff8800';
        ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffcc44';
        ctx.beginPath(); ctx.ellipse(0, -h * 0.45, w * 0.5, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      } else if (lv === 3) {
        const w = 6, h = 11;
        ctx.fillStyle = '#ff7700';
        ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffee00';
        ctx.beginPath(); ctx.ellipse(0, -h * 0.25, w * 0.55, h * 0.45, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, -h * 0.6, 2, 0, Math.PI * 2); ctx.fill();
      } else if (lv === 4) {
        const w = 7, h = 12;
        ctx.strokeStyle = 'rgba(255,140,0,0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, h * 0.3); ctx.lineTo(0, h * 1.1); ctx.stroke();
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-w * 0.5, h * 0.6); ctx.lineTo(-w * 0.3, h * 1.2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo( w * 0.5, h * 0.6); ctx.lineTo( w * 0.3, h * 1.2); ctx.stroke();
        ctx.fillStyle = '#ff7700';
        ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath(); ctx.ellipse(0, -h * 0.25, w * 0.6, h * 0.45, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, -h * 0.6, 2, 0, Math.PI * 2); ctx.fill();
      } else {
        const w = 9, h = 15;
        ctx.strokeStyle = 'rgba(255,100,0,0.35)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0, 0, w + 5, h + 5, 0, 0, Math.PI * 2); ctx.stroke();
        const grad = ctx.createRadialGradient(0, -h * 0.2, 1, 0, 0, h);
        grad.addColorStop(0,   '#ffff88');
        grad.addColorStop(0.3, '#ff8800');
        grad.addColorStop(1,   '#cc2200');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, -h * 0.45, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else if (b.type === 'missile') {
      ctx.fillStyle = '#ff8800';
      ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
      // Exhaust trail
      ctx.strokeStyle = 'rgba(255,160,0,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
      ctx.stroke();
    } else {
      // Vulcan bullet — draw trail for lv3+, then capsule
      if (b.trail && b.trail.length > 0 && b.lv >= 3) {
        const trailLen = b.lv >= 4 ? 5 : 3;
        const pts = b.trail.slice(0, trailLen);
        for (let t = 0; t < pts.length; t++) {
          const alpha = (1 - (t + 1) / (trailLen + 1)) * 0.55;
          ctx.strokeStyle = `rgba(200,240,255,${alpha})`;
          ctx.lineWidth = Math.max(0.5, 2.5 - t * 0.4);
          ctx.beginPath();
          if (t === 0) {
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(pts[t].x, pts[t].y);
          } else {
            ctx.moveTo(pts[t - 1].x, pts[t - 1].y);
            ctx.lineTo(pts[t].x, pts[t].y);
          }
          ctx.stroke();
        }
      }
      // Capsule
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle !== undefined ? b.angle + Math.PI/2 : 0);
      ctx.fillStyle = 'rgba(100,220,255,0.5)';
      ctx.beginPath(); ctx.ellipse(0, 0, 3, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(0, 0, 1.5, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  });
}

// === ENEMIES ===
let enemies  = [];
let boss     = null;   // single boss entity, null when no boss active

// diffMult: raised by stage 2 and each loop iteration (defined here, used by wave tables in Task 12)
let diffMult = 1.0;
let loopMult = 1;      // score multiplier that increases each loop

const ENEMY_CFG = [
  // type 0: small fighter
  { hp: 3,  r: 10, spd: 110, score: 100, dropChance: 0.15, color: '#66aaff' },
  // type 1: gunship
  { hp: 8,  r: 14, spd: 65,  score: 200, dropChance: 0.25, color: '#aacc44' },
  // type 2: bomber
  { hp: 20, r: 18, spd: 48,  score: 400, dropChance: 0.50, color: '#cc6622' },
  // type 3: turret (stationary)
  { hp: 12, r: 12, spd: 0,   score: 150, dropChance: 0.50, color: '#cc4466' },
];

// path: function(t) → {x, y}  (null for straight-down or stationary)
function mkEnemy(type, x, y, path) {
  return Object.assign(
    { type, x, y, path, pathT: 0, alive: true, fireTimer: 1.2 + Math.random(), angle: 0 },
    ENEMY_CFG[type]
  );
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  switch (e.type) {
    case 0: // small fighter — compact swept-wing
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(0, -12); ctx.lineTo(10, 8);
      ctx.lineTo(0, 4);   ctx.lineTo(-10, 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff4444';
      ctx.beginPath(); ctx.arc(0, -1, 3, 0, Math.PI*2); ctx.fill();
      break;
    case 1: // gunship — boxier/wider hull
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(14, 4);
      ctx.lineTo(8, 14);  ctx.lineTo(-8, 14); ctx.lineTo(-14, 4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffff44';
      ctx.beginPath(); ctx.arc(0, 2, 5, 0, Math.PI*2); ctx.fill();
      break;
    case 2: // bomber — elongated hull with turret nubs
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(0, -18); ctx.lineTo(18, 0);
      ctx.lineTo(16, 16); ctx.lineTo(-16, 16); ctx.lineTo(-18, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff8800';
      ctx.beginPath(); ctx.arc(-9, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( 9, 0, 5, 0, Math.PI*2); ctx.fill();
      break;
    case 3: // turret — static base + rotating barrel
      ctx.fillStyle = '#884422';
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#cc6644';
      ctx.save(); ctx.rotate(e.angle);
      ctx.fillRect(-3, -14, 6, 14);
      ctx.restore();
      break;
  }
  ctx.restore();
}

function updateEnemyMovement(e, dt) {
  if (e.path) {
    e.pathT += dt;
    const pos = e.path(e.pathT);
    e.x = pos.x; e.y = pos.y;
  } else if (e.type !== 3) {
    // straight down (used for enemies without a path function)
    e.y += e.spd * diffMult * dt;
  }
  // Turret barrel tracks player
  if (e.type === 3 && player && !player.dead) {
    const dx = player.x - e.x, dy = player.y - e.y;
    e.angle = Math.atan2(dx, -dy); // atan2(x,−y) = angle from north
  }
}

function fireEnemy(e) {
  if (!player || player.dead) return;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d  = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = 190 * diffMult;

  const mkEB = (vx, vy, clr) =>
    enemyBullets.push({ x: e.x, y: e.y, vx, vy, r: 4, clr });

  switch (e.type) {
    case 0: // single aimed shot
      mkEB(dx/d * spd, dy/d * spd, '#ff4444');
      break;
    case 1: // 3-way aimed spread
      [-0.28, 0, 0.28].forEach(a => {
        const ang = Math.atan2(dy, dx) + a;
        mkEB(Math.cos(ang)*spd, Math.sin(ang)*spd, '#ff8800');
      });
      break;
    case 2: // arcing downward fan (5 bullets)
      for (let i = -2; i <= 2; i++) {
        const ang = Math.PI/2 + i * 0.24;
        mkEB(Math.cos(ang)*spd*0.75, Math.sin(ang)*spd*0.75, '#ffcc00');
      }
      break;
    case 3: // aimed burst — 3 shots with slight speed variation + staggered spawn delay
      for (let j = 0; j < 3; j++) {
        const ang  = Math.atan2(dy, dx);
        const bspd = spd * (0.85 + j * 0.1);
        // delay each shot by 80 ms (respected by gameSpeed and bomb-clear via delay field)
        enemyBullets.push({ x: e.x, y: e.y,
          vx: Math.cos(ang)*bspd, vy: Math.sin(ang)*bspd,
          r: 4, clr: '#ff66ff', delay: j * 0.08 });
      }
      break;
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    updateEnemyMovement(e, dt);

    // Cull off-screen (generous margin for path enemies)
    if (e.y > H + 60 || e.x < -60 || e.x > W + 60) {
      enemies.splice(i, 1); continue;
    }

    // Fire timer
    const fireInterval = (e.type === 3 ? 1.6 : 2.2) / diffMult;
    e.fireTimer -= dt;
    if (e.fireTimer <= 0) {
      if (e.type === 3) {
        // [ARCADE] Turret stationary relative to scroll, fires only when player in range
        const dx = player.x - e.x, dy = player.y - e.y;
        if (dx*dx + dy*dy < 260*260) fireEnemy(e);
      } else {
        fireEnemy(e);
      }
      e.fireTimer = fireInterval + Math.random() * 0.5;
    }
  }
}

// === ENEMY BULLETS ===
let enemyBullets = [];

function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    // Delayed spawn (turret burst) — count down before the bullet becomes active
    if (b.delay) {
      b.delay -= dt;
      if (b.delay <= 0) delete b.delay;
      else continue;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) {
      enemyBullets.splice(i, 1);
    }
  }
}

function drawEnemyBullets() {
  enemyBullets.forEach(b => {
    ctx.fillStyle = b.clr;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI*2); ctx.fill();
  });
}

// === POWERUPS ===
let powerups = [];

const WEAPON_NAMES  = ['VULCAN', 'SPREAD', 'MISSILE'];
const WEAPON_COLORS = ['#ffaa00', '#ff8800', '#ff4488'];

function tryDropPowerup(e) {
  if (Math.random() >= e.dropChance) return;
  // Bomb pickup chance ~15% of drops; remainder is weapon orb
  const isBomb = Math.random() < 0.15;
  const wType  = Math.floor(Math.random() * 3);
  powerups.push({ x: e.x, y: e.y, vy: 55, r: 10, type: wType, isBomb, life: 9.0 });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pw = powerups[i];
    pw.y   += pw.vy * dt;
    pw.life -= dt;
    if (pw.y > H + 20 || pw.life <= 0) { powerups.splice(i, 1); }
  }
}

function checkPlayerVsPowerups() {
  if (!player || player.dead) return;
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pw = powerups[i];
    if (!circleHit(pw.x, pw.y, pw.r, player.x, player.y, player.r + 10)) continue;
    sfxPowerup();
    if (pw.isBomb) {
      player.bombs = Math.min(3, player.bombs + 1);
    } else {
      const slots = player.weapons;
      const existing = slots.findIndex(s => s.type === pw.type);
      if (existing !== -1) {
        // [ARCADE] Same type already held: level up that slot (cap 5)
        slots[existing].lv = Math.min(5, slots[existing].lv + 1);
      } else {
        // [COMBO] New weapon type — add to FIFO queue
        if (slots.length >= 2) {
          slots.shift(); // evict oldest
        }
        slots.push({ type: pw.type, lv: 1 });
      }
    }
    powerups.splice(i, 1);
  }
}

function drawPowerups() {
  powerups.forEach(pw => {
    ctx.save();
    ctx.translate(pw.x, pw.y);
    if (pw.isBomb) {
      ctx.fillStyle = '#ff88ff';
      ctx.beginPath(); ctx.arc(0, 0, pw.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('B', 0, 1);
    } else {
      ctx.fillStyle = WEAPON_COLORS[pw.type];
      ctx.beginPath(); ctx.arc(0, 0, pw.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(WEAPON_NAMES[pw.type][0], 0, 1);
    }
    ctx.restore();
  });
}

// === COLLISION ===
function circleHit(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return dx*dx + dy*dy < (ar + br) * (ar + br);
}

function checkPlayerBulletsVsEnemies() {
  // All bullet types (vulcan, plasma, missile) use circle collision
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = playerBullets.length - 1; j >= 0; j--) {
      const b = playerBullets[j];
      if (circleHit(e.x, e.y, e.r, b.x, b.y, b.r)) {
        e.hp -= b.dmg;
        if (b.type === 'bullet' && b.lv === 5) {
          spawnExplosion(b.x, b.y, 0.5, '#ffffff');
        }
        if (!b.pierce) { playerBullets.splice(j, 1); j--; }
      }
    }
    if (e.hp <= 0) {
      score += e.score * loopMult;
      saveHS();
      spawnExplosion(e.x, e.y, e.type + 1, e.color);
      tryDropPowerup(e);
      enemies.splice(i, 1);
    }
  }
}

function checkEnemyBulletsVsPlayer() {
  if (!player || player.dead || player.invTimer > 0) return;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (circleHit(b.x, b.y, b.r, player.x, player.y, player.r)) {
      enemyBullets.splice(i, 1);
      killPlayer();
      return; // one hit per frame
    }
  }
}

function checkEnemyBodiesVsPlayer() {
  if (!player || player.dead || player.invTimer > 0) return;
  enemies.forEach(e => {
    if (circleHit(e.x, e.y, e.r, player.x, player.y, player.r)) {
      killPlayer();
    }
  });
}

function checkPlayerBulletsVsBoss() {
  if (!boss) return;

  // All bullet types vs boss — circle collision
  for (let j = playerBullets.length - 1; j >= 0; j--) {
    const b = playerBullets[j];
    if (circleHit(boss.x, boss.y, boss.r, b.x, b.y, b.r)) {
      boss.hp -= b.dmg;
      if (b.type === 'bullet' && b.lv === 5) {
        spawnExplosion(b.x, b.y, 0.5, '#ffffff');
      }
      if (!b.pierce) { playerBullets.splice(j, 1); j--; }
    }
  }
  if (boss && boss.hp <= 0) onBossDeath();
}

function checkBossBodyVsPlayer() {
  if (!boss || !player || player.dead || player.invTimer > 0) return;
  if (circleHit(boss.x, boss.y, boss.r, player.x, player.y, player.r)) {
    killPlayer();
  }
}

function runCollision() {
  checkPlayerBulletsVsEnemies();
  checkEnemyBulletsVsPlayer();
  checkEnemyBodiesVsPlayer();
  checkPlayerBulletsVsBoss();
  checkBossBodyVsPlayer();
  checkPlayerVsPowerups();
}

// === WAVE TABLES ===
// Path functions return {x, y} given elapsed time t (seconds)

function pathDown(sx, sy, spd) {
  return t => ({ x: sx, y: sy + t * spd });
}

function pathSin(sx, sy, spd, amp, freq) {
  return t => ({ x: sx + Math.sin(t * freq) * amp, y: sy + t * spd });
}

// Formation: N ships evenly spaced horizontally, centered on cx
function pathFormation(cx, sy, spd, idx, total) {
  const offset = (idx - (total - 1) / 2) * 36;
  return t => ({ x: cx + offset, y: sy + t * spd });
}

// Returns array of spawn entries sorted by trigger time t
function buildWaveTable(stage) {
  const entries = [];
  const add = obj => entries.push(obj);

  switch (stage) {
    case 1: {
      const fS = 105 * diffMult, bS = 62 * diffMult;
      for (let i = 0; i < 5; i++)
        add({ t: 0.5 + i*0.28, type: 0, path: pathFormation(W/2, -20, fS, i, 5) });
      add({ t: 3.5, type: 1, path: pathDown(W*0.25, -30, bS) });
      add({ t: 3.5, type: 1, path: pathDown(W*0.75, -30, bS) });
      for (let i = 0; i < 4; i++)
        add({ t: 5.5 + i*0.35, type: 0, path: pathSin(W*0.18 + i*90, -20, fS*0.9, 45, 1.6) });
      add({ t: 8, type: 3, x: 80,  y: 290 });
      add({ t: 8, type: 3, x: 240, y: 240 });
      add({ t: 8, type: 3, x: 400, y: 290 });
      add({ t: 10, type: 2, path: pathDown(W/2, -40, 44 * diffMult) });
      for (let i = 0; i < 6; i++)
        add({ t: 12 + i*0.22, type: 0, path: pathFormation(W/2, -20, fS*1.15, i, 6) });
      add({ t: 14, type: 1, path: pathSin(W*0.5, -30, bS, 65, 1.9) });
      for (let i = 0; i < 3; i++)
        add({ t: 17 + i*1.4, type: 1, path: pathDown(80 + i*160, -30, bS) });
      add({ t: 20, type: 3, x: 150, y: 200 });
      add({ t: 20, type: 3, x: 330, y: 215 });
      add({ t: 22, type: 2, path: pathDown(W*0.33, -40, 40*diffMult) });
      add({ t: 22, type: 2, path: pathDown(W*0.67, -40, 40*diffMult) });
      for (let i = 0; i < 8; i++)
        add({ t: 26 + i*0.18, type: 0, path: pathFormation(W/2, -20, fS*1.3, i, 8) });
      add({ t: 30, boss: 1 });
      break;
    }
    case 2: {
      const fS = 145 * diffMult, bS = 88 * diffMult;
      for (let i = 0; i < 5; i++)
        add({ t: 0.5 + i*0.28, type: 0, path: pathFormation(W/2, -20, fS, i, 5) });
      add({ t: 3.5, type: 1, path: pathDown(W*0.25, -30, bS) });
      add({ t: 3.5, type: 1, path: pathDown(W*0.75, -30, bS) });
      for (let i = 0; i < 4; i++)
        add({ t: 5.5 + i*0.35, type: 0, path: pathSin(W*0.18 + i*90, -20, fS*0.9, 45, 1.6) });
      add({ t: 8, type: 3, x: 80,  y: 290 });
      add({ t: 8, type: 3, x: 240, y: 240 });
      add({ t: 8, type: 3, x: 400, y: 290 });
      add({ t: 10, type: 2, path: pathDown(W/2, -40, 44 * diffMult) });
      for (let i = 0; i < 6; i++)
        add({ t: 12 + i*0.22, type: 0, path: pathFormation(W/2, -20, fS*1.15, i, 6) });
      add({ t: 14, type: 1, path: pathSin(W*0.5, -30, bS, 65, 1.9) });
      for (let i = 0; i < 3; i++)
        add({ t: 17 + i*1.4, type: 1, path: pathDown(80 + i*160, -30, bS) });
      add({ t: 20, type: 3, x: 150, y: 200 });
      add({ t: 20, type: 3, x: 330, y: 215 });
      add({ t: 22, type: 2, path: pathDown(W*0.33, -40, 40*diffMult) });
      add({ t: 22, type: 2, path: pathDown(W*0.67, -40, 40*diffMult) });
      for (let i = 0; i < 8; i++)
        add({ t: 26 + i*0.18, type: 0, path: pathFormation(W/2, -20, fS*1.3, i, 8) });
      add({ t: 30, boss: 2 });
      break;
    }
    case 3: {
      const fS = 160 * diffMult, bS = 95 * diffMult;
      for (let i = 0; i < 6; i++)
        add({ t: 0.5 + i*0.20, type: 0, path: pathFormation(W/2, -20, fS, i, 6) });
      add({ t: 2.5, type: 1, path: pathDown(W*0.20, -30, bS) });
      add({ t: 2.5, type: 1, path: pathDown(W*0.80, -30, bS) });
      for (let i = 0; i < 6; i++)
        add({ t: 3.0 + i*0.18, type: 0, path: pathSin(W*0.15 + i*60, -20, fS*0.85, 38, 2.0) });
      add({ t: 4.0, type: 1, path: pathDown(W*0.35, -30, bS) });

      add({ t: 10, type: 3, x: 120, y: 260 });

      for (let i = 0; i < 5; i++)

      add({ t: 8, type: 3, x: 80,  y: 240 });
      add({ t: 8, type: 3, x: 200, y: 210 });
      add({ t: 8, type: 3, x: 320, y: 210 });

      add({ t: 11, type: 2, path: pathDown(W*0.3, -40, 36*diffMult) });

let waveTable    = [];
let waveIndex    = 0;
let stageTimer   = 0;
let currentStage = 1;
let bossSpawned  = false;

function updateWaves(dt) {
  if (boss) return; // don't advance wave clock while boss is alive
  stageTimer += dt;

  while (waveIndex < waveTable.length) {
    const entry = waveTable[waveIndex];
    if (stageTimer < entry.t) break;
    waveIndex++;

    if (entry.boss) {
      // [ARCADE] Boss spawns only after all regular enemies are cleared
      // Force-clear any remaining enemies (turrets may never scroll off)
      enemies.length = 0;
      enemyBullets.length = 0;
      boss = createBoss(entry.boss);
      bossSpawned = true;
    } else if (entry.type === 3) {
      const e = mkEnemy(3, entry.x, entry.y, null);
      if (entry.eliteHp) e.hp = Math.ceil(e.hp * 1.5);
      enemies.push(e);
    } else {
      const e = mkEnemy(entry.type, 0, 0, entry.path);
      if (entry.path) { const p0 = entry.path(0); e.x = p0.x; e.y = p0.y; }
      if (entry.eliteHp) e.hp = Math.ceil(e.hp * 1.5);
      enemies.push(e);
    }
  }
}

function startStage(stage) {
  currentStage  = stage;
  diffMult = STAGE_DIFF[stage - 1] * (1 + (loopMult - 1) * 0.2);
  initBackground(stage);
  waveTable     = buildWaveTable(stage);
  waveIndex     = 0;
  stageTimer    = 0;
  bossSpawned   = false;
  boss          = null;
  enemies.length       = 0;
  enemyBullets.length  = 0;
  playerBullets.length = 0;
  powerups.length      = 0;
}

function updateStageClear(dt) {
  stageClearTimer -= dt;
  if (stageClearTimer <= 0) {
    startStage(currentStage + 1);
    state = STATE.PLAYING;
  }
}

// === BOSS ===
let bossMaxHp  = 0;
let bossPhase  = 0;
let bossTimer  = 0;
let bossAngle  = 0;   // rotating arms angle
let stageClearTimer = 0;
let victoryTimer = 0;

function createBoss(stageNum) {
  const stats = [
    { r: 50, hp:  800, phaseCount: 3, spawnMinions: false },
    { r: 60, hp: 1000, phaseCount: 3, spawnMinions: false },
    { r: 50, hp: 1100, phaseCount: 3, spawnMinions: false },
    { r: 55, hp: 1200, phaseCount: 3, spawnMinions: false },
    { r: 52, hp: 1300, phaseCount: 3, spawnMinions: false },
    { r: 65, hp: 1500, phaseCount: 4, spawnMinions: true  },
    { r: 50, hp: 1400, phaseCount: 4, spawnMinions: false },
    { r: 75, hp: 2000, phaseCount: 5, spawnMinions: true  },
  ];
  const s = stats[stageNum - 1];
  bossMaxHp = s.hp;
  bossPhase = 0;
  bossTimer = 0;
  bossAngle = 0;
  return {
    stageNum,
    x: W/2, y: 130,
    r: s.r,
    hp: s.hp,
    targetX: W/2, targetY: 130,
    spd: 58,
    fireTimer: 1.8,
    phaseCount:   s.phaseCount,
    spawnMinions: s.spawnMinions,
    minionTimer:  3.0,
    phantomAlpha: 1.0,
  };
}

function drawBoss() {
  if (!boss) return;
  switch (boss.stageNum) {
    case 1: drawBoss1(); break;
    case 2: drawBoss2(); break;
    case 3: drawBoss3(); break;
    case 4: drawBoss4(); break;
    case 5: drawBoss5(); break;
    case 6: drawBoss6(); break;
    case 7: drawBoss7(); break;
    case 8: drawBoss8(); break;
  }
  drawBossHpBar();
}

function drawBossHpBar() {
  const bw = 200, bh = 10;
  const bx = (W - bw) / 2, by = H - 28;
  ctx.fillStyle = '#222';
  ctx.fillRect(bx, by, bw, bh);
  const frac    = Math.max(0, boss.hp / bossMaxHp);
  const hpColor = frac > 0.5 ? '#00ee44' : frac > 0.25 ? '#ffaa00' : '#ff2200';
  ctx.fillStyle = hpColor;
  ctx.fillRect(bx, by, bw * frac, bh);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('BOSS', W/2, by - 3);
}

function drawBoss1() {
  ctx.save();
  ctx.translate(boss.x, boss.y);
  const grad = ctx.createRadialGradient(0, 0, 8, 0, 0, boss.r);
  grad.addColorStop(0, '#ff6622'); grad.addColorStop(0.5, '#882211'); grad.addColorStop(1, '#330800');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, boss.r, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.rotate(bossAngle);
  for (let i = 0; i < 4; i++) {
    ctx.save(); ctx.rotate(i * Math.PI/2);
    ctx.fillStyle = '#bb3300';
    ctx.fillRect(-4, 0, 8, boss.r * 0.88);
    ctx.fillStyle = '#ff7700';
    ctx.beginPath(); ctx.arc(0, boss.r * 0.82, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(0, 0,  8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';    ctx.beginPath(); ctx.arc(0, 0,  3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#9933ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.rotate(-bossAngle * 1.2);
  for (let i = 0; i < 4; i++) {
    ctx.save(); ctx.rotate(i * Math.PI / 2);
    ctx.strokeStyle = 'rgba(180,60,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, boss.r * 0.75); ctx.stroke();
    ctx.fillStyle = '#aa44ff';
    ctx.beginPath(); ctx.arc(0, boss.r * 0.7, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = '#cc00ff'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#440088'; ctx.beginPath(); ctx.arc(0, 0,  7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff88ff'; ctx.beginPath(); ctx.arc(0, 0,  3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBoss8() {
  const pulse = 0.85 + Math.sin(bossTimer * 2.2) * 0.15;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  const outerR = boss.r * pulse;
  const outerGlow = ctx.createRadialGradient(0, 0, outerR * 0.5, 0, 0, outerR * 1.4);
  outerGlow.addColorStop(0, 'rgba(180,0,20,0.2)');
  outerGlow.addColorStop(1, 'rgba(80,0,10,0)');
  ctx.fillStyle = outerGlow;
  ctx.beginPath(); ctx.arc(0, 0, outerR * 1.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  for (let a = 0; a < Math.PI * 2; a += 0.1) {
    const distort = 1 + Math.sin(a * 5 + bossTimer) * 0.08;
    const rx = Math.cos(a) * outerR * distort;
    const ry = Math.sin(a) * outerR * distort;
    a === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
  }
  ctx.closePath();
  ctx.fillStyle = '#550010'; ctx.fill();
  ctx.strokeStyle = '#bb0022'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.rotate(-bossAngle * 0.5);
  ctx.fillStyle = '#880022';
  ctx.beginPath(); ctx.arc(0, 0, boss.r * 0.7, 0, Math.PI*2); ctx.fill();
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate(i * Math.PI / 3);
    ctx.fillStyle = '#aa0033';
    ctx.beginPath();
    ctx.moveTo(-4, boss.r * 0.5); ctx.lineTo(0, boss.r * 0.72); ctx.lineTo(4, boss.r * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  const coreR = boss.r * 0.4 * pulse;
  const coreGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, coreR);
  coreGrad.addColorStop(0, '#ffffff'); coreGrad.addColorStop(0.4, '#ff4444'); coreGrad.addColorStop(1, '#880000');
  ctx.fillStyle = coreGrad;
  ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function fireBoss() {
  if (!player || player.dead || !boss) return;
  switch (boss.stageNum) {
    case 1: fireBoss1(); break;
    case 2: fireBoss2(); break;
    case 3: fireBoss3(); break;
    case 4: fireBoss4(); break;
    case 5: fireBoss5(); break;
    case 6: fireBoss6(); break;
    case 7: fireBoss7(); break;
    case 8: fireBoss8(); break;
  }
}

function fireBoss1() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (175 + bossPhase * 35) * diffMult;
  const mkEB = (vx, vy, clr) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: 5, clr });
  switch (bossPhase) {
    case 0:
      for (let i = -3; i <= 3; i++) {
        const ang = Math.atan2(dy, dx) + i * 0.14;
        mkEB(Math.cos(ang)*spd, Math.sin(ang)*spd, '#ff2200');
      }
      break;
    case 1:
      [-0.08, 0.08].forEach(a => {
        const ang = Math.atan2(dy, dx) + a;
        mkEB(Math.cos(ang)*spd, Math.sin(ang)*spd, '#ff8800');
      });
      break;
    case 2:
      for (let i = 0; i < 8; i++) {
        const ang = bossAngle + i * Math.PI*2/8;
        mkEB(Math.cos(ang)*spd*0.7, Math.sin(ang)*spd*0.7, '#cc00ff');
      }
      break;
  }
}

function fireBoss2() {
  const spd = (120 + bossPhase * 20) * diffMult;
  const count = [8, 12, 16][Math.min(bossPhase, 2)];
  const mkEB = (vx, vy, clr) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: 5, clr });
  for (let i = 0; i < count; i++) {
    const ang = bossAngle + (i / count) * Math.PI * 2;
    mkEB(Math.cos(ang)*spd, Math.sin(ang)*spd, '#4466ff');
  }
}

function fireBoss3() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (165 + bossPhase * 30) * diffMult;
  const mkEB = (ox, vx, vy, clr) => enemyBullets.push({ x: boss.x + ox, y: boss.y, vx, vy, r: 5, clr });
  const side = Math.floor(bossTimer * 2) % 2 === 0 ? -1 : 1;
  const ox = side * (boss.r + 14);
  const baseA = Math.atan2(dy, dx);
  for (let j = 0; j < 3; j++) {
    const a = baseA + (j - 1) * 0.08;
    mkEB(ox, Math.cos(a)*spd, Math.sin(a)*spd, '#ff8800');
  }
}

function fireBoss4() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (140 + bossPhase * 25) * diffMult;
  const mkEB = (vx, vy, clr, r) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: r||5, clr });
  mkEB((Math.random()-0.5)*20, 12, '#44ee44', 7);
  const baseA = Math.atan2(dy, dx);
  for (let j = -1; j <= 1; j++) {
    const a = baseA + j * 0.22;
    mkEB(Math.cos(a)*spd, Math.sin(a)*spd, '#88cc00');
  }
}

function fireBoss5() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (155 + bossPhase * 30) * diffMult;
  const mkEB = (vx, vy, clr) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: 5, clr });
  const arcCount = 5 + bossPhase * 2;
  const halfSpan = 0.40;
  for (let i = 0; i < arcCount; i++) {
    const a = bossAngle + (-halfSpan + (i / (arcCount-1)) * halfSpan * 2);
    mkEB(Math.cos(a)*spd*0.85, Math.sin(a)*spd*0.85, '#ffaa00');
  }
  mkEB(dx/d*spd, dy/d*spd, '#ffff44');
}

function fireBoss6() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (160 + bossPhase * 28) * diffMult;
  const mkEB = (vx, vy, clr) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: 5, clr });
  const spreadCount = 5 + bossPhase;
  const baseA = Math.atan2(dy, dx);
  for (let i = 0; i < spreadCount; i++) {
    const a = baseA + (-0.35 + (i / (spreadCount-1)) * 0.70);
    mkEB(Math.cos(a)*spd, Math.sin(a)*spd, '#00ccff');
  }
}

function fireBoss7() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (200 + bossPhase * 35) * diffMult;
  const mkEB = (vx, vy, clr) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: 5, clr });
  [-0.06, 0.06].forEach(a => {
    const ang = Math.atan2(dy, dx) + a;
    mkEB(Math.cos(ang)*spd, Math.sin(ang)*spd, '#aa44ff');
  });
  const scatterCount = 2 + bossPhase;
  for (let i = 0; i < scatterCount; i++) {
    const a = Math.random() * Math.PI * 2;
    mkEB(Math.cos(a)*spd*0.7, Math.sin(a)*spd*0.7, '#cc88ff');
  }
}

function fireBoss8() {
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  const spd = (175 + bossPhase * 28) * diffMult;
  const mkEB = (vx, vy, clr, r) => enemyBullets.push({ x: boss.x, y: boss.y, vx, vy, r: r||5, clr });
  const ringCount = 8 + bossPhase * 2;
  for (let i = 0; i < ringCount; i++) {
    const a = bossAngle + (i / ringCount) * Math.PI * 2;
    mkEB(Math.cos(a)*spd*0.65, Math.sin(a)*spd*0.65, '#ff2200');
  }
  if (bossPhase >= 1) {
    const baseA = Math.atan2(dy, dx);
    [-0.10, 0, 0.10].forEach(off => {
      mkEB(Math.cos(baseA+off)*spd, Math.sin(baseA+off)*spd, '#ff8800');
    });
  }
  if (bossPhase >= 2) {
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      mkEB(Math.cos(a)*spd*0.75, Math.sin(a)*spd*0.75, '#ffaa00');
    }
  }
}

function updateBoss(dt) {
  if (!boss) return;
  bossTimer += dt;
  bossAngle += dt * 0.85;

  const dx = boss.targetX - boss.x, dy = boss.targetY - boss.y;
  const d  = Math.sqrt(dx*dx + dy*dy) || 1;
  if (d > 5) {
    boss.x += dx/d * boss.spd * dt;
    boss.y += dy/d * boss.spd * dt;
  } else {
    boss.targetX = 80 + Math.random() * (W - 160);
    boss.targetY = 60 + Math.random() * 140;
  }

  const hpPct = boss.hp / bossMaxHp;
  bossPhase = boss.phaseCount - 1 - Math.floor(hpPct * boss.phaseCount);
  bossPhase = Math.max(0, Math.min(boss.phaseCount - 1, bossPhase));

  if (boss.stageNum === 7) {
    boss.phantomAlpha = 0.65 + Math.sin(bossTimer * 1.5) * 0.35;
  }

  if (boss.spawnMinions) {
    boss.minionTimer -= dt;
    if (boss.minionTimer <= 0) {
      spawnMinion();
      boss.minionTimer = 3.0 / diffMult;
    }
  }

  boss.fireTimer -= dt;
  if (boss.fireTimer <= 0) {
    fireBoss();
    const rate = [1.2, 0.85, 0.55, 0.38, 0.28][Math.min(bossPhase, 4)];
    boss.fireTimer = (rate / diffMult) + Math.random() * 0.25;
  }
}

function spawnMinion() {
  if (!boss) return;
  const e = mkEnemy(0, boss.x + (Math.random()-0.5)*40, boss.y + 20, null);
  e.spd = ENEMY_CFG[0].spd * diffMult * 1.2;
  enemies.push(e);
}

function onBossDeath() {
  const bossStage = boss.stageNum || boss.num || 1;
  const explosionCount = 2 + Math.floor(bossStage * 0.5);
  spawnExplosion(boss.x,      boss.y,      6, '#ffaa00');
  spawnExplosion(boss.x + 35, boss.y - 25, 4, '#ff4400');
  spawnExplosion(boss.x - 35, boss.y + 15, 4, '#ffcc00');
  for (let i = 0; i < explosionCount - 3; i++) {
    const ox = (Math.random() - 0.5) * boss.r * 2;
    const oy = (Math.random() - 0.5) * boss.r * 2;
    spawnExplosion(boss.x + ox, boss.y + oy, 3, '#ff8800');
  }
  const bossScore = 5000 + bossStage * 2000;
  score += bossScore * loopMult;
  saveHS();
  boss = null;

  if (currentStage < STAGE_COUNT) {
    state = STATE.STAGECLEAR;
    stageClearTimer = 3.0;
  } else {
    if (loopMult === 1) {
      state = STATE.VICTORY;
      victoryTimer = 0;
    } else {
      loopMult++;
      startStage(1);
      state = STATE.PLAYING;
    }
  }
}

// === HUD & SCREENS ===
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'alphabetic';

  // Score (top-left)
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score, 8, 18);

  // Hi-score (top-right)
  ctx.textAlign = 'right';
  ctx.fillText('HI: ' + highScore, W - 8, 18);

  // Stage / loop (top-center)
  ctx.fillStyle = '#999';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  const loopStr = loopMult > 1 ? '  Loop ' + loopMult : '';
  ctx.fillText('STAGE ' + currentStage + loopStr, W/2, 18);

  // Lives icons (bottom-left row)
  ctx.fillStyle = '#88ccff';
  ctx.font = '13px monospace';
  ctx.textAlign = 'left';
  for (let i = 0; i < player.lives; i++) ctx.fillText('\u25c6', 8 + i * 14, H - 8);

  // Bomb icons (above lives row)
  ctx.fillStyle = '#ff88ff';
  for (let i = 0; i < player.bombs; i++) ctx.fillText('\u2605', 8 + i * 14, H - 24);

  // Weapon name + level (bottom-right)
  ctx.textAlign = 'right';
  ctx.font = '12px monospace';
  const wSlots = player.weapons;
  if (wSlots.length === 1) {
    ctx.fillStyle = WEAPON_COLORS[wSlots[0].type];
    ctx.fillText(WEAPON_NAMES[wSlots[0].type] + ' Lv' + wSlots[0].lv, W - 8, H - 8);
  } else {
    wSlots.forEach((slot, i) => {
      ctx.fillStyle = WEAPON_COLORS[slot.type];
      ctx.fillText(WEAPON_NAMES[slot.type] + ' Lv' + slot.lv, W - 8, H - 8 - i * 16);
    });
  }

  ctx.restore();
}

  ctx.fillRect(0, 0, W, H);

  ctx.shadowColor = '#0099ff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 72px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('RAIDEN', W/2, 200);
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  ctx.fillStyle = '#aaaaff';
  ctx.font = '14px monospace';
  ctx.fillText('ARCADE CLONE', W/2, 230);

  ctx.fillStyle = '#ffff44';
  ctx.font = '16px monospace';
  if (Math.floor(Date.now() / 500) % 2)
    ctx.fillText('PRESS ENTER TO START', W/2, 340);

  ctx.fillStyle = '#aaaaaa';
  ctx.font = '13px monospace';
  ctx.fillText('HI-SCORE: ' + highScore, W/2, 390);

  ctx.fillStyle = '#888';
  ctx.font = '11px monospace';
  if (isTouch) {
    ctx.fillText('TAP TO START', W/2, 460);
    ctx.fillText('D-pad move   FIRE   ★ bomb   ⚙ settings', W/2, 478);
  } else {
    ctx.fillText('ARROWS move   SPACE fire   B bomb', W/2, 460);
    ctx.fillText('P pause   S settings', W/2, 478);
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W/2, H/2 - 10);
  ctx.fillStyle = '#aaa';
  ctx.font = '14px monospace';
  ctx.fillText('P to resume', W/2, H/2 + 24);
}

  ctx.strokeStyle = '#4488ff';

  ctx.textAlign = 'center';

  ctx.fillStyle = '#aaaaff';
  ctx.fillText('M  Sound: ' + (soundOn ? 'ON ' : 'OFF'), W/2, by + 68);
  ctx.fillText('[  Speed: ' + gameSpeed.toFixed(2) + 'x  ]', W/2, by + 92);

  ctx.fillStyle = '#666';
  ctx.font = '11px monospace';

  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('SCORE: ' + score, W/2, 320);
  ctx.fillText('HI-SCORE: ' + highScore, W/2, 348);

}

function drawStageClear() {

  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffff44';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 20;
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('STAGE CLEAR!', W/2, H/2 - 10);
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('STAGE ' + (currentStage + 1) + ' INCOMING...', W/2, H/2 + 30);
}

// === STATE MACHINE — startGame stub ===
function updateVictory(dt) { /* victory stays until Enter */ }

function drawVictory() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur  = 40;
  ctx.fillStyle   = '#ffd700';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('MISSION', W/2, H/2 - 70);
  ctx.fillText('COMPLETE', W/2, H/2 - 22);
  ctx.shadowBlur  = 0;
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#ffffff';
  ctx.font = '18px monospace';
  ctx.fillText('SCORE: ' + score, W/2, H/2 + 30);
  ctx.fillText('HI-SCORE: ' + highScore, W/2, H/2 + 58);
  ctx.fillStyle = '#ffff44';
  ctx.font = '14px monospace';
  if (Math.floor(Date.now() / 500) % 2)
    ctx.fillText('PRESS ENTER', W/2, H/2 + 100);
}

function startGame() {
  score     = 0;
  player    = createPlayer();
  particles.length = 0;
  powerups.length  = 0;
  startStage(1);
  state = STATE.PLAYING;
}

// === MAIN LOOP ===
let lastTime = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  const rawDt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  const dt = rawDt * gameSpeed;

  // Update
  if (state !== STATE.PAUSED) updateStars(dt);
  if (state === STATE.PLAYING || state === STATE.STAGECLEAR) updateBackground(dt);
  if (state === STATE.PLAYING || state === STATE.STAGECLEAR) updateParticles(dt);
  if (state === STATE.STAGECLEAR) updateStageClear(dt);
  if (state === STATE.VICTORY) updateVictory(dt);
  if (state === STATE.PLAYING) {
    updatePlayer(dt);
    updatePlayerBullets(dt);
    updateEnemies(dt);
    updateEnemyBullets(dt);
    runCollision();
    updatePowerups(dt);
    updateBoss(dt);
    updateWaves(dt);
  }


  // Render
  ctx.textAlign = 'left';
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  if (state === STATE.PLAYING || state === STATE.STAGECLEAR || state === STATE.PAUSED) {
    drawBackground(currentStage);
  } else {
    ctx.fillStyle = '#020208';
    ctx.fillRect(0, 0, W, H);
    drawStars();
  }

  if (state === STATE.TITLE)         drawTitle();
  else if (state === STATE.GAMEOVER) drawGameOver();
  else if (state === STATE.VICTORY)  drawVictory();
  else {
    enemies.forEach(drawEnemy);
    drawBoss();
    drawEnemyBullets();
    drawPowerups();
    drawPlayerBullets();
    drawPlayer(player);
    drawLaserBeam(player);   // drawn after player so beam appears from gun tip
    drawParticles();
    drawHUD();
    if (state === STATE.PAUSED)      drawPause();
    if (state === STATE.STAGECLEAR)  drawStageClear();
  }
  if (settingsOpen) drawSettings();
  drawTouchControls();
}

// === BOOTSTRAP ===
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
